async function importBackup(file) {
  try {
    const text = await file.text();
    const data = JSON.parse(text);
    if (!data || !Array.isArray(data.items)) throw new Error('格式不对');
    if (!confirm('导入会覆盖当前全部数据，确定继续？')) return;
    for (const st of ['items', 'outfits', 'schedule', 'inspirations', 'profile', 'kv']) await dbClear(st);
    for (const it of data.items) await dbPut('items', it);
    for (const o of data.outfits || []) await dbPut('outfits', o);
    for (const ev of data.schedule || []) await dbPut('schedule', ev);
    for (const ins of data.inspirations || []) await dbPut('inspirations', ins);
    if (data.profile) await dbPut('profile', { k: 'main', v: data.profile });
    for (const d of data.diags || []) await dbPut('kv', d);
    await loadAll();
    closeModal();
    renderCloset(); renderSchedule(); renderInspo(); renderDiagHistory(); renderDiagnose();
    toast('📥 备份恢复成功！', 'ok', 3200);
  } catch (e) {
    toast('⚠️ 备份文件解析失败：' + e.message, 'warn', 3200);
  }
}

/* ==================================================================
   PWA：动态 manifest / Service Worker / 安装引导
   ================================================================== */
function setupPWA() {
  /* 动态 manifest：保留 sharecode 查询参数；图标使用内联 data URI（单文件离线可用） */
  const ICON = window.__INLINE_ICONS__ || {};
  try {
    const manifest = {
      name: 'AI衣橱 · 智能穿搭工作台',
      short_name: 'AI衣橱',
      description: '自动抠图入库 · AI穿搭生成 · 日程规划 · 穿搭诊断 · 灵感收集',
      start_url: './index.html' + window.location.search,
      scope: './',
      display: 'standalone',
      orientation: 'portrait',
      background_color: '#FAF6F0',
      theme_color: '#FAF6F0',
      icons: [
        { src: ICON['icons/icon-192.png'], sizes: '192x192', type: 'image/png' },
        { src: ICON['icons/icon-512.png'], sizes: '512x512', type: 'image/png' },
        { src: ICON['icons/maskable-192.png'], sizes: '192x192', type: 'image/png', purpose: 'maskable' },
        { src: ICON['icons/maskable-512.png'], sizes: '512x512', type: 'image/png', purpose: 'maskable' },
      ],
    };
    const blob = new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' });
    const link = $('#manifest-link');
    link.href = URL.createObjectURL(blob);
  } catch (e) { /* 静默 */ }

  /* Service Worker：单文件模式下用 Blob 注册，缓存当前页面实现离线打开 */
  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    window.addEventListener('load', () => {
      const swCode = "const CACHE='ai-wardrobe-single-v1';" +
        "self.addEventListener('install',e=>{e.waitUntil(self.skipWaiting())});" +
        "self.addEventListener('activate',e=>{e.waitUntil(self.clients.claim())});" +
        "self.addEventListener('fetch',e=>{const r=e.request;if(r.method!=='GET')return;" +
        "e.respondWith(caches.match(r,{ignoreSearch:true}).then(h=>h||fetch(r).then(res=>{" +
        "try{const c=res.clone();caches.open(CACHE).then(x=>x.put(r,c)).catch(()=>{})}catch(_){}return res;" +
        "}).catch(()=>caches.match('./',{ignoreSearch:true}))))});";
      try {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      } catch (e) { /* 静默 */ }
    });
  }
  /* 图标：内联 data URI 注入 favicon 与 apple-touch-icon（不依赖外部文件） */
  try {
    const mk = (rel, href) => { const l = document.createElement('link'); l.rel = rel; l.href = href; document.head.appendChild(l); };
    if (ICON['icons/favicon-64.png']) mk('icon', ICON['icons/favicon-64.png']);
    if (ICON['icons/apple-touch-icon.png']) mk('apple-touch-icon', ICON['icons/apple-touch-icon.png']);
  } catch (e) { /* 静默 */ }
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    S.installEvt = e;
    showInstallTip();
  });
  window.addEventListener('appinstalled', () => {
    localStorage.setItem('wr_installed', '1');
    hideInstallTip();
    toast('🎉 已安装到主屏幕！', 'ok');
  });
  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
  const standalone = window.navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches;
  if (!localStorage.getItem('wr_installed') && !standalone) {
    setTimeout(() => {
      showInstallTip(isIOS);
    }, 1800);
  }
}

function showInstallTip(isIOS) {
  const slot = $('#install-tip-slot');
  if (!slot || localStorage.getItem('wr_tip_closed')) return;
  slot.innerHTML = '<div class="install-tip"><span style="font-size:20px">📲</span>' +
    '<div><b>添加到主屏幕</b>，像 APP 一样全屏使用<br>' +
    (isIOS
      ? 'iOS：<b>分享</b>按钮 → <b>添加到主屏幕</b>'
      : 'Android：浏览器菜单 → <b>安装应用</b>') +
    '</div>' +
    '<button class="btn small" id="tip-install" style="flex-shrink:0">安装</button>' +
    '<button class="it-close" id="tip-close">✕</button></div>';
  $('#tip-close').addEventListener('click', () => {
    localStorage.setItem('wr_tip_closed', '1');
    hideInstallTip();
  });
  const inst = $('#tip-install');
  if (S.installEvt) {
    inst.addEventListener('click', async () => {
      S.installEvt.prompt();
      const r = await S.installEvt.userChoice;
      if (r && r.outcome === 'accepted') localStorage.setItem('wr_installed', '1');
      S.installEvt = null;
      hideInstallTip();
    });
  } else {
    inst.textContent = '看指引';
    inst.addEventListener('click', () => {
      openModal(modalHead('📲 添加到主屏幕') + '<div class="m-body"><div class="w-steps" style="margin-top:6px">' +
        (isIOS
          ? '1️⃣ 打开 Safari 底部的 <b>分享</b> 按钮（⬆️）<br>2️⃣ 滑动找到 <b>添加到主屏幕</b><br>3️⃣ 点右上角 <b>添加</b>，完成 ✨<br><br>之后从主屏幕打开，就是全屏无地址栏的 APP 体验'
          : '1️⃣ 点浏览器右上角 <b>⋮ 菜单</b><br>2️⃣ 选择 <b>安装应用 / 添加到主屏幕</b><br>3️⃣ 确认后桌面出现 AI衣橱 图标 ✨') +
        '</div></div>');
    });
  }
}
function hideInstallTip() { const s = $('#install-tip-slot'); if (s) s.innerHTML = ''; }

/* ---------------- 初始化 ---------------- */
async function init() {
  await loadAll();
  loadCfg();
  S.diagRecords = [];

  /* 导航 */
  $$('.tabbar .tab').forEach((t) => t.addEventListener('click', () => switchView(t.dataset.view)));

  /* 顶部按钮 */
  $('#btn-analyze').addEventListener('click', runAnalyze);
  $('#btn-settings').addEventListener('click', openSettings);

  /* 上传：无论成功/失败/超时都复位输入，避免入口被锁 */
  $('#file-input').addEventListener('change', (e) => {
    const fs = e.target.files;
    if (fs && fs.length) handleFiles(fs);
    e.target.value = '';
  });

  /* 衣橱搜索 & 筛选 */
  $('#closet-search').addEventListener('input', debounce((e) => { S.searchText = e.target.value; renderCloset(); }, 200));
  $('#btn-filter').addEventListener('click', toggleFilterPanel);
  $('#closet-cats').addEventListener('click', (e) => {
    const c = e.target.closest('[data-cat]');
    if (!c) return;
    S.filterCat = c.dataset.cat;
    renderCloset();
  });

  /* 穿搭生成 */
  const tempRange = $('#m-temp');
  tempRange.addEventListener('input', () => {
    $('#m-temp-val').textContent = tempRange.value + '°C ' + tempDesc(Number(tempRange.value));
  });
  $('#btn-generate').addEventListener('click', () => onGenerate(4));
  $('#btn-week7').addEventListener('click', () => onGenerate(7));

  /* 日程 & 打包 */
  $('#t-days').addEventListener('input', () => { $('#t-days-val').textContent = $('#t-days').value + ' 天'; });
  $('#btn-add-schedule').addEventListener('click', openAddSchedule);
  $('#btn-pack').addEventListener('click', onPack);

  /* 诊断 */
  $('#btn-diag-upload').addEventListener('click', () => $('#diag-input').click());
  $('#diag-input').addEventListener('change', (e) => { onDiagUpload(e.target.files); e.target.value = ''; });
  $('#btn-diag-go').addEventListener('click', runDiagnose);

  /* 灵感箱 */
  $('#btn-inspo-outfit').addEventListener('click', () => { S.inspoType = 'outfit'; $('#inspo-input').click(); });
  $('#btn-inspo-item').addEventListener('click', () => { S.inspoType = 'item'; $('#inspo-input').click(); });
  $('#inspo-input').addEventListener('change', (e) => { handleInspoFiles(e.target.files); e.target.value = ''; });

  /* 备份导入 */
  $('#restore-input').addEventListener('change', (e) => { if (e.target.files[0]) importBackup(e.target.files[0]); e.target.value = ''; });

  /* v1.3：穿搭历史月视图左右切换月份 */
  $('#cal-prev').addEventListener('click', () => calShift(-1));
  $('#cal-next').addEventListener('click', () => calShift(1));

  /* 全局指令：删除单品 / 标记闲置 / 清空衣橱 —— 由设置与详情页承载 */

  renderCloset();
  renderMatch();
  renderSchedule();
  renderDiagnose();
  renderInspo();
  renderCalendar();

  setupPWA();
  showWelcomeOnce();
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
else init();

})();
}
