/* ============ AI衣橱 · 奶油极简主题 ============ */
:root {
  --bg: #FAF6F0;
  --bg-deep: #F3ECE2;
  --card: #FFFFFF;
  --cream: #F6EFE6;
  --cream-line: #EDE3D5;
  --primary: #B98F6B;
  --primary-deep: #8C6F52;
  --text: #4A4238;
  --text-2: #7A6F63;
  --text-3: #A99C8E;
  --peach: #E8C9B5;
  --sage: #9CAF95;
  --rose: #D9A49A;
  --danger: #C97B6D;
  --radius: 20px;
  --radius-s: 14px;
  --shadow: 0 3px 14px rgba(140, 111, 82, 0.09);
  --shadow-sm: 0 2px 8px rgba(140, 111, 82, 0.07);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
}

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "HarmonyOS Sans SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 15px;
  line-height: 1.6;
  min-height: 100vh;
  overscroll-behavior-y: none;
}
img { display: block; max-width: 100%; }
button { font-family: inherit; border: none; background: none; cursor: pointer; color: inherit; }
input, select, textarea { font-family: inherit; font-size: 15px; color: var(--text); }
::placeholder { color: var(--text-3); }

#app {
  max-width: 520px;
  margin: 0 auto;
  min-height: 100vh;
  min-height: 100dvh;
  background: var(--bg);
  position: relative;
  display: flex;
  flex-direction: column;
}

/* ---------- 顶部 ---------- */
.header {
  position: sticky;
  top: 0;
  z-index: 50;
  padding: calc(var(--safe-t) + 14px) 18px 12px;
  background: linear-gradient(180deg, var(--bg) 78%, rgba(250,246,240,0));
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.header .logo { display: flex; align-items: center; gap: 9px; }
.header .logo .logo-icon {
  width: 38px; height: 38px; border-radius: 12px;
  background: var(--cream);
  display: flex; align-items: center; justify-content: center;
  font-size: 20px;
  box-shadow: var(--shadow-sm);
}
.header .logo h1 { font-size: 18px; font-weight: 700; letter-spacing: 0.5px; }
.header .logo h1 small { display: block; font-size: 10.5px; color: var(--text-3); font-weight: 500; letter-spacing: 2px; }
.header .h-actions { display: flex; gap: 8px; }
.icon-btn {
  width: 36px; height: 36px; border-radius: 12px;
  background: var(--card); box-shadow: var(--shadow-sm);
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; color: var(--primary-deep);
  transition: transform 0.15s;
}
.icon-btn:active { transform: scale(0.92); }

/* ---------- 主内容 ---------- */
.main { flex: 1; padding: 6px 14px 100px; }
.view { display: none; animation: fadeIn 0.25s ease; }
.view.active { display: block; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* ---------- 底部导航 ---------- */
.tabbar {
  position: fixed;
  bottom: 0; left: 50%; transform: translateX(-50%);
  width: 100%; max-width: 520px;
  z-index: 60;
  background: rgba(255,255,255,0.96);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border-top: 1px solid var(--cream-line);
  display: flex;
  padding: 7px 4px calc(var(--safe-b) + 7px);
}
.tabbar .tab {
  flex: 1;
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  font-size: 10.5px; color: var(--text-3);
  padding: 4px 0;
  border-radius: 12px;
  transition: color 0.2s;
}
.tabbar .tab .t-emoji { font-size: 21px; filter: grayscale(0.45); opacity: 0.75; transition: all 0.2s; }
.tabbar .tab.active { color: var(--primary-deep); font-weight: 600; }
.tabbar .tab.active .t-emoji { filter: none; opacity: 1; transform: translateY(-1px) scale(1.08); }
.tabbar .tab .t-badge {
  position: absolute; margin-left: 20px; margin-top: -2px;
  background: var(--rose); color: #fff; font-size: 9px; font-weight: 700;
  min-width: 15px; height: 15px; border-radius: 8px;
  display: flex; align-items: center; justify-content: center; padding: 0 3px;
}

/* ---------- 通用卡片 ---------- */
.card {
  background: var(--card);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 16px;
  margin-bottom: 14px;
}
.card-title { font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 7px; margin-bottom: 10px; }
.card-title .sub { font-size: 11px; color: var(--text-3); font-weight: 500; margin-left: auto; }
.section-gap { height: 8px; }

/* 按钮 */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  border-radius: 14px;
  padding: 11px 18px;
  font-size: 14.5px; font-weight: 600;
  background: var(--cream); color: var(--primary-deep);
  transition: transform 0.15s, opacity 0.15s;
}
.btn:active { transform: scale(0.96); }
.btn.primary {
  background: linear-gradient(135deg, #C9A27E, #AD8562);
  color: #fff;
  box-shadow: 0 4px 14px rgba(185, 143, 107, 0.35);
}
.btn.small { padding: 7px 13px; font-size: 12.5px; border-radius: 11px; }
.btn.ghost { background: transparent; border: 1.5px solid var(--cream-line); color: var(--text-2); }
.btn.danger { background: #F9E8E4; color: var(--danger); }
.btn.full { width: 100%; }
.btn:disabled { opacity: 0.45; }

/* chips */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  padding: 7px 14px;
  border-radius: 999px;
  background: var(--card);
  border: 1.5px solid var(--cream-line);
  font-size: 13px; color: var(--text-2);
  display: inline-flex; align-items: center; gap: 5px;
  transition: all 0.18s;
  white-space: nowrap;
}
.chip.on {
  background: var(--primary); border-color: var(--primary); color: #fff;
  box-shadow: 0 3px 10px rgba(185,143,107,0.3);
}
.chip.mini { padding: 4px 10px; font-size: 11px; border-width: 1px; border-radius: 999px; background: var(--cream); border-color: transparent; color: var(--text-2); }
.chip.mini.on { background: var(--peach); color: var(--primary-deep); }
.chip.idle-chip { background: #EEF3EC; color: #6F8A6A; border-color: transparent; }

/* 输入 */
.field { margin-bottom: 13px; }
.field label { display: block; font-size: 12.5px; color: var(--text-2); font-weight: 600; margin-bottom: 6px; }
.input, select.input, textarea.input {
  width: 100%;
  background: var(--cream);
  border: 1.5px solid transparent;
  border-radius: var(--radius-s);
  padding: 11px 14px;
  font-size: 15px;
  outline: none;
  transition: border 0.2s;
}
.input:focus { border-color: var(--primary); background: #fff; }
select.input { appearance: none; -webkit-appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--text-3) 50%), linear-gradient(135deg, var(--text-3) 50%, transparent 50%); background-position: calc(100% - 19px) 55%, calc(100% - 14px) 55%; background-size: 5px 5px; background-repeat: no-repeat; }
.slider-row { display: flex; align-items: center; gap: 12px; }
.slider-row input[type=range] { flex: 1; accent-color: var(--primary); }
.slider-val { min-width: 74px; text-align: center; background: var(--cream); border-radius: 10px; padding: 6px 4px; font-size: 13px; font-weight: 700; color: var(--primary-deep); }

/* ---------- 衣橱 ---------- */
.closet-stats {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;
  margin-bottom: 12px;
}
.stat-box {
  background: var(--card); border-radius: 16px; box-shadow: var(--shadow-sm);
  padding: 10px 6px; text-align: center;
}
.stat-box .n { font-size: 19px; font-weight: 800; color: var(--primary-deep); }
.stat-box .l { font-size: 10.5px; color: var(--text-3); }
.stat-box.warn .n { color: var(--rose); }

.search-row { display: flex; gap: 9px; margin-bottom: 11px; }
.search-row .input { flex: 1; border-radius: 999px; padding: 10px 16px; }
.search-row .filter-btn {
  width: 44px; border-radius: 999px; background: var(--card);
  box-shadow: var(--shadow-sm); font-size: 18px;
  display: flex; align-items: center; justify-content: center;
}

.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 11px; }
.item-card {
  background: var(--card); border-radius: 18px; box-shadow: var(--shadow-sm);
  overflow: hidden; position: relative;
  transition: transform 0.15s;
}
.item-card:active { transform: scale(0.97); }
.item-card .thumb {
  aspect-ratio: 1/1; background: #fff; position: relative; overflow: hidden;
}
.item-card .thumb img { width: 100%; height: 100%; object-fit: contain; }
.item-card .cat-corner {
  position: absolute; top: 8px; left: 8px;
  background: rgba(250,246,240,0.92); backdrop-filter: blur(4px);
  font-size: 10px; padding: 3px 8px; border-radius: 999px; color: var(--text-2); font-weight: 600;
}
.item-card .idle-flag {
  position: absolute; top: 8px; right: 8px;
  background: #EEF3EC; color: #6F8A6A;
  font-size: 10px; padding: 3px 8px; border-radius: 999px; font-weight: 700;
}
.item-card .info { padding: 9px 10px 11px; }
.item-card .info .nm { font-size: 13px; font-weight: 700; line-height: 1.35; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; }
.item-card .info .tags { font-size: 10.5px; color: var(--text-3); margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.empty {
  text-align: center; padding: 44px 20px 30px; color: var(--text-3);
}
.empty .e-emoji { font-size: 42px; margin-bottom: 10px; }
.empty .e-tips { font-size: 13px; line-height: 1.8; }
.empty .btn { margin-top: 14px; }

/* 上传区 */
.upload-hero {
  border: 2px dashed var(--cream-line);
  border-radius: var(--radius);
  padding: 22px 16px;
  text-align: center;
  background: rgba(255,255,255,0.6);
  margin-bottom: 14px;
}
.upload-hero .u-emoji { font-size: 34px; }
.upload-hero .u-t1 { font-size: 15px; font-weight: 700; margin-top: 6px; }
.upload-hero .u-t2 { font-size: 11.5px; color: var(--text-3); margin-top: 3px; }
.upload-hero .btn { margin-top: 12px; }

/* 处理队列 */
.queue-card { display: flex; align-items: center; gap: 11px; padding: 11px; background: var(--card); border-radius: 16px; box-shadow: var(--shadow-sm); margin-bottom: 9px; }
.queue-card .q-thumb { width: 54px; height: 54px; border-radius: 12px; object-fit: cover; background: var(--cream); flex-shrink: 0; }
.queue-card .q-info { flex: 1; min-width: 0; }
.queue-card .q-name { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.queue-card .q-status { font-size: 11px; color: var(--text-3); }
.queue-card .q-status.ok { color: #6F8A6A; }
.queue-card .q-status.warn { color: var(--rose); }

/* ---------- 表格（markdown 风格） ---------- */
.md-table { width: 100%; border-collapse: collapse; font-size: 12.5px; margin: 8px 0; }
.md-table th {
  background: var(--cream); color: var(--primary-deep);
  font-weight: 700; padding: 8px 10px; text-align: left;
  border-bottom: 2px solid var(--cream-line);
}
.md-table td { padding: 8px 10px; border-bottom: 1px solid var(--cream-line); color: var(--text-2); }
.md-table tr:last-child td { border-bottom: none; }
.md-table td b { color: var(--text); }

/* ---------- 穿搭结果 ---------- */
.outfit-card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 15px; margin-bottom: 14px; position: relative; overflow: hidden; }
.outfit-card .o-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.outfit-card .o-title { font-size: 14.5px; font-weight: 800; display: flex; gap: 6px; align-items: center; }
.outfit-card .o-looks { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
.outfit-card .o-looks::-webkit-scrollbar { display: none; }
.outfit-card .o-look { width: 74px; flex-shrink: 0; text-align: center; }
.outfit-card .o-look img { width: 74px; height: 74px; border-radius: 14px; background: #fff; border: 1px solid var(--cream-line); object-fit: contain; }
.outfit-card .o-look .cat-dot { font-size: 9.5px; color: var(--text-3); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.outfit-card .o-note { font-size: 12.5px; color: var(--text-2); line-height: 1.75; margin-top: 10px; background: var(--cream); border-radius: 12px; padding: 10px 12px; }
.outfit-card .o-note b { color: var(--primary-deep); }
.outfit-card .o-acts { display: flex; gap: 8px; margin-top: 11px; }

/* ---------- 日程 ---------- */
.day-card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow-sm); padding: 14px; margin-bottom: 11px; }
.day-card .d-head { display: flex; align-items: center; gap: 9px; margin-bottom: 10px; }
.day-card .d-date { background: var(--cream); border-radius: 12px; padding: 7px 11px; text-align: center; min-width: 56px; }
.day-card .d-date .dd { font-size: 17px; font-weight: 800; color: var(--primary-deep); line-height: 1.1; }
.day-card .d-date .dw { font-size: 10px; color: var(--text-3); }
.day-card .d-title { font-size: 14px; font-weight: 700; flex: 1; }
.day-card .d-looks { display: flex; gap: 7px; flex-wrap: wrap; }
.day-card .d-looks img { width: 56px; height: 56px; border-radius: 11px; background: #fff; border: 1px solid var(--cream-line); object-fit: contain; }
.day-card .d-empty-tip { font-size: 12px; color: var(--text-3); padding: 8px 0; }

/* ---------- 灵感箱 ---------- */
.inspo-card { background: var(--card); border-radius: 16px; box-shadow: var(--shadow-sm); overflow: hidden; margin-bottom: 12px; }
.inspo-card img { width: 100%; max-height: 300px; object-fit: cover; background: var(--cream); }
.inspo-card .i-info { padding: 11px 13px; display: flex; align-items: center; gap: 8px; }
.inspo-card .i-tag { font-size: 10.5px; font-weight: 700; border-radius: 999px; padding: 3px 9px; }
.inspo-card .i-tag.have { background: #EEF3EC; color: #6F8A6A; }
.inspo-card .i-tag.want { background: #F8E9DE; color: #B4795A; }
.inspo-card .i-note { flex: 1; font-size: 12px; color: var(--text-2); }
.inspo-card .i-x { font-size: 15px; color: var(--text-3); padding: 4px; }

/* ---------- 诊断 ---------- */
.diag-report { font-size: 13px; line-height: 1.85; color: var(--text-2); }
.diag-report h5 { font-size: 13.5px; color: var(--text); margin: 12px 0 5px; display: flex; gap: 6px; align-items: center; }
.diag-report h5:first-child { margin-top: 0; }
.diag-report ul { padding-left: 18px; }
.diag-report li { margin-bottom: 4px; }
.diag-photo { width: 100%; border-radius: 14px; max-height: 340px; object-fit: contain; background: var(--cream); margin-bottom: 10px; }

/* ---------- 弹层 ---------- */
.modal-mask {
  position: fixed; inset: 0; z-index: 100;
  background: rgba(74, 66, 56, 0.45);
  backdrop-filter: blur(3px);
  display: flex; align-items: flex-end; justify-content: center;
  animation: fadeIn 0.2s ease;
}
.modal {
  width: 100%; max-width: 520px;
  background: var(--bg);
  border-radius: 26px 26px 0 0;
  max-height: 88vh; max-height: 88dvh;
  display: flex; flex-direction: column;
  animation: slideUp 0.28s cubic-bezier(0.22, 1, 0.36, 1);
  padding-bottom: var(--safe-b);
}
@keyframes slideUp { from { transform: translateY(60px); opacity: 0.6; } to { transform: none; opacity: 1; } }
.modal .m-head {
  padding: 15px 18px 11px;
  display: flex; align-items: center; justify-content: space-between;
  position: sticky; top: 0; background: var(--bg); z-index: 2;
  border-radius: 26px 26px 0 0;
}
.modal .m-head .m-title { font-size: 16.5px; font-weight: 800; }
.modal .m-close {
  width: 30px; height: 30px; border-radius: 999px; background: var(--cream);
  color: var(--text-2); font-size: 14px; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
}
.modal .m-body { padding: 4px 18px 22px; overflow-y: auto; }

/* 单品详情 */
.detail-photo { width: 100%; border-radius: 18px; background: #fff; border: 1px solid var(--cream-line); margin-bottom: 12px; }
.detail-name { font-size: 17px; font-weight: 800; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.detail-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin: 14px 0; }
.detail-actions .btn { padding: 10px; font-size: 13px; }
.tag-edit-block { margin-top: 12px; }
.tag-edit-block .tb-title { font-size: 12px; font-weight: 700; color: var(--text-2); margin: 10px 0 7px; display: flex; align-items: center; gap: 5px; }

/* toast */
#toast-wrap {
  position: fixed; top: calc(var(--safe-t) + 14px); left: 50%; transform: translateX(-50%);
  z-index: 200; width: min(480px, calc(100vw - 40px));
  display: flex; flex-direction: column; gap: 8px; align-items: center;
  pointer-events: none;
}
.toast {
  background: rgba(74, 66, 56, 0.92);
  color: #FFF9F2;
  padding: 10px 18px; border-radius: 999px;
  font-size: 13px; font-weight: 600;
  box-shadow: 0 6px 20px rgba(0,0,0,0.18);
  animation: toastIn 0.25s ease;
  max-width: 100%;
  text-align: center;
}
.toast.ok { background: #7B8F77; }
.toast.warn { background: #C4897B; }
@keyframes toastIn { from { opacity: 0; transform: translateY(-8px) scale(0.95); } to { opacity: 1; transform: none; } }
.toast.out { opacity: 0; transform: translateY(-8px); transition: all 0.3s; }

/* 批量编辑（入库确认） */
.batch-card { background: var(--card); border-radius: 18px; box-shadow: var(--shadow-sm); padding: 12px; margin-bottom: 11px; }
.batch-card .b-top { display: flex; gap: 11px; }
.batch-card .b-img { width: 84px; height: 84px; border-radius: 14px; background: #fff; border: 1px solid var(--cream-line); object-fit: contain; flex-shrink: 0; }
.batch-card .b-info { flex: 1; min-width: 0; }
.batch-card .b-name { font-size: 14px; font-weight: 700; }
.batch-card .b-color { font-size: 11px; color: var(--text-3); margin-top: 2px; display: flex; align-items: center; gap: 5px; }
.batch-card .b-color .dot { width: 10px; height: 10px; border-radius: 999px; border: 1px solid var(--cream-line); display: inline-block; }
.batch-card .b-cats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 10px; }
.batch-card .b-cat {
  border: 1.5px solid var(--cream-line); border-radius: 11px;
  padding: 7px 2px; font-size: 11.5px; text-align: center; color: var(--text-2);
  transition: all 0.15s;
}
.batch-card .b-cat .c-e { display: block; font-size: 16px; }
.batch-card .b-cat.on { background: var(--primary); border-color: var(--primary); color: #fff; }
.batch-card .b-warn { font-size: 11px; color: var(--rose); margin-top: 6px; }

/* 快捷工具条 */
.quickbar { display: flex; gap: 8px; margin-bottom: 12px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.quickbar::-webkit-scrollbar { display: none; }
.quickbar .btn { flex-shrink: 0; }
.quickbar .btn.small { padding: 8px 14px; }

/* 分析报告 */

/* 单选七类大按钮 */

.cat-pick .cp { border: 1.5px solid var(--cream-line); border-radius: 12px; padding: 9px 2px; text-align: center; font-size: 11.5px; color: var(--text-2); background: #fff; }

/* 颜色：RGB -> HSL */
function rgb2hsl(r, g, b) {
  r /= 255; g /= 255; b /= 255;
  const max = Math.max(r, g, b), min = Math.min(r, g, b);
  const l = (max + min) / 2;
  let h = 0, s = 0;
  const d = max - min;
  if (d > 0.00001) {
    s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
    if (max === r) h = ((g - b) / d + (g < b ? 6 : 0));
    else if (max === g) h = (b - r) / d + 2;
    else h = (r - g) / d + 4;
    h *= 60;
  }
  return { h, s, l };
}

function colorNameOf(r, g, b) {
  const { h, s, l } = rgb2hsl(r, g, b);
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b);

function cutout(img, opt = {}) {

  };
  for (let x = 0; x < w; x++) { tryEnqueue(x, -1); tryEnqueue((h - 1) * w + x, -1); }
  for (let y = 0; y < h; y++) { tryEnqueue(y * w, -1); tryEnqueue(y * w + w - 1, -1); }
  while (qh < qt) {
    const p = queue[qh++];
    const px = p % w, py = (p / w) | 0;
    if (px > 0) tryEnqueue(p - 1, p);
    if (px < w - 1) tryEnqueue(p + 1, p);
    if (py > 0) tryEnqueue(p - w, p);
    if (py < h - 1) tryEnqueue(p + w, p);
  }

  /* 3. 前景占比 */
  let fgCount = 0;
  for (let p = 0; p < n; p++) if (!mask[p]) fgCount++;
  const fgRatio = fgCount / n;

  /* 4. alpha + 边缘羽化 */
  const alpha = new Uint8ClampedArray(n).fill(255);
  for (let p = 0; p < n; p++) if (mask[p]) alpha[p] = 0;
  const t0 = tolSq * 0.18, t1 = tolSq * 2.1;
  const feather = (p, band) => {
    if (mask[p]) return;
    const i = p * 4;
    const d = distToBgSq(data[i], data[i + 1], data[i + 2]);
    let a = (d - t0) / (t1 - t0);
    if (band === 2) a = Math.max(a, 0.55);       // 内圈保护衣物主体
    a = Math.max(0.05, Math.min(1, a));
    const v = Math.round(a * 255);
    if (v < alpha[p]) alpha[p] = v;
  };
  const inEdge = new Uint8Array(n); // 1=第一圈边界
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const p = y * w + x;
      if (mask[p]) continue;
      if ((x > 0 && mask[p - 1]) || (x < w - 1 && mask[p + 1]) || (y > 0 && mask[p - w]) || (y < h - 1 && mask[p + w])) inEdge[p] = 1;
    }
  }
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const p = y * w + x;
      if (mask[p] || inEdge[p]) continue;
      if ((x > 0 && inEdge[p - 1]) || (x < w - 1 && inEdge[p + 1]) || (y > 0 && inEdge[p - w]) || (y < h - 1 && inEdge[p + w])) feather(p, 2);
    }
  }
  for (let p = 0; p < n; p++) if (inEdge[p]) feather(p, 1);

  const simple = fgRatio > 0.015 && fgRatio < 0.985;
  /* 守卫：背景几乎没被抠掉（如整图近纯色 / 背景与衣物同色）→ 保留整图，不误删衣物 */
  if (fgRatio < 0.005) {
    alpha.fill(255);
    return { alpha, mask, fgRatio: 1, simple: false };
  }
  return { alpha, mask, fgRatio, simple };
}

/* 合成纯白背景（保留全部画幅，不裁切衣物） */
function composeWhite(img, alpha) {
  const src = img.data, out = new Uint8ClampedArray(src.length);
  for (let p = 0; p < alpha.length; p++) {
    const a = alpha[p] / 255;
    const i = p * 4;
    out[i]     = src[i]     * a + 255 * (1 - a);
    out[i + 1] = src[i + 1] * a + 255 * (1 - a);
    out[i + 2] = src[i + 2] * a + 255 * (1 - a);
    out[i + 3] = 255;
  }
  return { data: out, width: img.width, height: img.height };
}

/* 提取主色（仅统计前景内部像素） */
function extractColors(img, alpha) {
  const data = img.data, w = img.width, h = img.height;
  const inW = Math.max(1, Math.floor(w * 0.06)), inH = Math.max(1, Math.floor(h * 0.06));
  const buckets = {};
  for (let y = inH; y < h - inH; y++) {
    for (let x = inW; x < w - inW; x++) {
      const p = y * w + x;
      if (alpha[p] < 200) continue;
      const i = p * 4;
      const key = ((data[i] >> 5) << 6) | ((data[i + 1] >> 5) << 3) | (data[i + 2] >> 5);
      const b = buckets[key] || (buckets[key] = { r: 0, g: 0, b: 0, c: 0 });
      b.r += data[i]; b.g += data[i + 1]; b.b += data[i + 2]; b.c++;
    }
  }
  const total = Object.values(buckets).reduce((s, b) => s + b.c, 0) || 1;
  const arr = Object.values(buckets).map((b) => ({
    r: Math.round(b.r / b.c), g: Math.round(b.g / b.c), b: Math.round(b.b / b.c), c: b.c,
  })).sort((a, b) => b.c - a.c);
  const byName = {};
  for (const b of arr) {
    const nm = colorNameOf(b.r, b.g, b.b);
    byName[nm] = byName[nm] || { name: nm, r: 0, g: 0, b: 0, c: 0 };
    byName[nm].r += b.r; byName[nm].g += b.g; byName[nm].b += b.b; byName[nm].c += b.c;
  }
  const colors = Object.values(byName).sort((a, b) => b.c - a.c).map((c) => ({
    name: c.name,
    ratio: Math.round((c.c / total) * 100),
    r: Math.round(c.r / c.c), g: Math.round(c.g / c.c), b: Math.round(c.b / c.c),
  })).filter((c, i) => c.ratio > 0 && (c.ratio >= 6 || i < 2)).slice(0, 4);
  return colors.length ? colors : [{ name: '花色', ratio: 100, r: 180, g: 160, b: 140 }];
}

const rgb2hex = (r, g, b) => '#' + [r, g, b].map((v) => v.toString(16).padStart(2, '0')).join('');

/* UMD 导出（供 Node 测试） */
if (typeof module !== 'undefined' && module.exports) {
  module.exports = { cutout, composeWhite, extractColors, colorNameOf, rgb2hsl, rgb2hex, hueFamily, isNeutralName, lightnessOfName };
}

function drawScaled(img, maxSide) {
  let w = img.width || img.naturalWidth, h = img.height || img.naturalHeight;

}

/* ==================================================================
   图片前端压缩：控制分辨率与体积，降低接口负载、防止大图超时
   ================================================================== */
async function compressImageFile(file, opt = {}) {
  const maxSide = opt.maxSide || 1024;
  const quality = opt.quality != null ? opt.quality : 0.82;
  const maxBytes = opt.maxBytes || 1.5 * 1024 * 1024;
  const im = await loadImageFile(file);
  const { canvas, w, h } = drawScaled(im, maxSide);
  let out = canvas.toDataURL('image/jpeg', quality);
  /* 体积仍偏大 → 阶梯式降质重压 */
  let q2 = quality;
  while (dataUrlSize(out) > maxBytes && q2 > 0.4) {
    q2 -= 0.12;
    out = canvas.toDataURL('image/jpeg', q2);
  }
  return { dataUrl: out, width: w, height: h, size: dataUrlSize(out) };
}
function dataUrlSize(dataUrl) {
  const i = dataUrl.indexOf(',');
  const b64 = dataUrl.slice(i + 1);
  return Math.round(b64.length * 3 / 4);
}
function fmtBytes(n) {
  return n >= 1048576 ? (n / 1048576).toFixed(1) + 'MB' : Math.round(n / 1024) + 'KB';
}

/* ==================================================================
   接口调用层：统一超时 / 异常捕获，失败抛出可读错误，绝不卡死
   ================================================================== */
function fetchWithTimeout(url, options = {}, timeout = 30000) {
  return new Promise((resolve, reject) => {
    const ctrl = new AbortController();
    const timer = setTimeout(() => {
      ctrl.abort();
      reject(new Error('接口请求超时（>' + Math.round(timeout / 1000) + 's），请检查网络或接口地址'));
    }, timeout);
    fetch(url, Object.assign({}, options, { signal: ctrl.signal }))
      .then((res) => { clearTimeout(timer); resolve(res); })
      .catch((e) => {
        clearTimeout(timer);
        if (e && e.name === 'AbortError') return;
        reject(new Error('网络请求失败：' + (e && e.message ? e.message : '未知错误')));
      });
  });
}

    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ image: dataUrl, model: 'RMBG-1.4' }),
  }, 45000);
  if (!res.ok) throw new Error('抠图接口返回异常（HTTP ' + res.status + '）');
  const ct = (res.headers.get('content-type') || '').toLowerCase();
  if (ct.includes('image/')) {
    const blob = await res.blob();
    return await blobToDataURL(blob);
  }
  /* JSON 形态：兼容 image / data / result / base64 等常见返回字段 */
  let j = null;
  try { j = await res.json(); } catch (e) { throw new Error('抠图接口返回内容无法解析'); }
  const d = j && (j.image || j.data || j.result || j.base64 || (j.data && j.data.image));
  if (!d || typeof d !== 'string') throw new Error('抠图接口未返回图片数据');
  return d.startsWith('data:') ? d : 'data:image/png;base64,' + d;
}

/* 解析严格 JSON：容错剥离代码块与多余文字，仍取不到则抛错 */
function parseStrictJSON(text) {
  let s = String(text).trim();
  s = s.replace(/^```(?:json)?\s*/i, '').replace(/```\s*$/i, '').trim();
  const a = s.indexOf('{'), b = s.lastIndexOf('}');
  if (a >= 0 && b > a) s = s.slice(a, b + 1);
  let obj = null;
  try { obj = JSON.parse(s); } catch (e) { throw new Error('大模型返回内容不是合法 JSON'); }
  const FIELDS = ['category', 'color', 'fabric', 'season', 'style', 'remark'];
  const out = {};
  FIELDS.forEach((k) => { out[k] = obj[k] == null ? '' : String(obj[k]).trim(); });
  return out;
}

function blobToDataURL(blob) {
  return new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onload = () => resolve(fr.result);
    fr.onerror = () => reject(new Error('图片数据读取失败'));
    fr.readAsDataURL(blob);
  });
}

const TASK_TIMEOUT = 60000;
function withTaskTimeout(promise, label, ms) {
  return new Promise((resolve, reject) => {
    const t = setTimeout(() => reject(new Error((label || '任务') + '超时（>' + Math.round((ms || TASK_TIMEOUT) / 1000) + 's）')), ms || TASK_TIMEOUT);
    promise.then((v) => { clearTimeout(t); resolve(v); }, (e) => { clearTimeout(t); reject(e); });

}

    cat: catKey,

    style: (meta && meta.style) || '',
    season: (meta && meta.season) || '',
    fit: (meta && meta.fit) || '',
    remark: (meta && meta.remark) || '',

  };

/* 把透明 PNG 合成为纯白底卡片（保留全部细节，不裁切） */
async function flattenToWhite(dataUrl) {
  const im = await loadImageFromAny(dataUrl);
  const { canvas, w, h } = drawScaled(im, 1100);
  const ctx = canvas.getContext('2d');
  const outCv = document.createElement('canvas');
  outCv.width = w; outCv.height = h;
  const octx = outCv.getContext('2d');
  octx.fillStyle = '#FFFFFF';
  octx.fillRect(0, 0, w, h);
  octx.drawImage(canvas, 0, 0);
  const data = octx.getImageData(0, 0, w, h);
  /* 以 alpha 通道作为前景掩码提取主色（透明背景图） */
  const alpha = new Uint8ClampedArray(w * h);
  const orig = ctx.getImageData(0, 0, w, h);
  for (let p = 0; p < w * h; p++) alpha[p] = orig.data[p * 4 + 3];
  const colors = extractColors(data, alpha);
  return { dataUrl: outCv.toDataURL('image/jpeg', 0.86), colors };
}

async function colorsFromImage(dataUrl) {
  const im = await loadImageFromAny(dataUrl);
  const { w, h } = drawScaled(im, 400);
  const cv = document.createElement('canvas');
  cv.width = w; cv.height = h;
  const ctx = cv.getContext('2d');
  ctx.drawImage(im, 0, 0, w, h);
  const data = ctx.getImageData(0, 0, w, h);
  const alpha = new Uint8ClampedArray(w * h).fill(255);
  return extractColors(data, alpha);
}

async function makeThumb(dataUrl) {
  const im = await loadImageFromAny(dataUrl);
  const ts = 260 / Math.max(im.width, im.height);
  const cv = document.createElement('canvas');
  cv.width = Math.max(1, Math.round(im.width * ts));
  cv.height = Math.max(1, Math.round(im.height * ts));
  cv.getContext('2d').drawImage(im, 0, 0, cv.width, cv.height);
  return cv.toDataURL('image/jpeg', 0.8);
}

/* 把 GLM 返回字段映射到衣橱内部结构（字段名与旧版完全一致） */
function normalizeRecognition(rec, colorFallback) {
  const nameMap = { '上衣': 'top', '外套': 'coat', '下装': 'bottom', '连衣裙': 'dress', '鞋履': 'shoes', '包包': 'bag', '配饰': 'acc' };
  const cat = nameMap[rec.category] || (CATS.find((c) => rec.category && rec.category.includes(c.name)) || {}).key || 'top';
  const colorStr = (rec.color || '').trim();
  const hitColor = COLOR_CHIPS.find((c) => colorStr.includes(c)) || (colorFallback ? colorFallback.name : '');
  const seasonHit = SEASONS.filter((s) => (rec.season || '').includes(s));
  const styleHit = STYLES.filter((s) => (rec.style || '').includes(s));
  /* 宽松/修身 从 remark 或 fabric 中抽取 */
  let fit = '';
  const combined = (rec.remark || '') + (rec.fabric || '') + (rec.style || '');
  if (/宽松|oversize|Oversize/.test(combined)) fit = '宽松';
  else if (/修身|紧身|贴身/.test(combined)) fit = '修身';
  else if (/常规|标准/.test(combined)) fit = '常规';
  return {
    cat,
    mainColor: hitColor || (colorFallback ? colorFallback.name : ''),
    name: (colorStr ? colorStr : (hitColor || '')) + catOf(cat).name,
    fabric: (rec.fabric || '').trim(),
    style: styleHit.length ? styleHit.join('、') : (rec.style || '').trim(),
    season: seasonHit.length ? seasonHit.join('、') : (rec.season || '').trim(),
    fit,
    remark: (rec.remark || '').trim(),
  };
}

async function handleFiles(files) {
  const imgs = Array.from(files).filter((f) => f.type.startsWith('image/'));
  if (!imgs.length) { toast('⚠️ 未选择有效图片', 'warn'); return; }
  if (S.isUploading) { toast('⏳ 正在处理上一批图片，请稍候…', 'warn'); return; }

  /* 上传前图片预览 */
  await showPreview(imgs);

  S.isUploading = true;
  updateUploadButton();
  toast('📥 收到 ' + imgs.length + ' 张图片，开始处理…', '', 2200);
  const failed = [];
  try {
    for (let i = 0; i < imgs.length; i++) {
      try {
        const card = await withTaskTimeout(processOneImage(imgs[i]), '第 ' + (i + 1) + ' 张图片处理', TASK_TIMEOUT);
        S.batch.push(card);
      } catch (e) {
        failed.push((i + 1) + '. ' + (e && e.message ? e.message : '未知错误'));
      }
    }
    if (S.batch.length) openBatchModal();
    if (failed.length) {
      toast('⚠️ ' + failed.length + ' 张处理失败：' + failed.slice(0, 2).join('；') + (failed.length > 2 ? ' 等' : ''), 'warn', 5000);
    }
  } finally {
    /* 无论成功、失败还是超时，一律解除上传锁并恢复上传入口 */
    S.isUploading = false;
    updateUploadButton();
    renderCloset();
  }
}

/* 上传前的图片预览层 */
async function showPreview(files) {
  const items = [];
  for (const f of files.slice(0, 20)) {
    try {
      const comp = await compressImageFile(f, { maxSide: 360, quality: 0.7, maxBytes: 200 * 1024 });
      items.push(comp);
    } catch (e) { /* 单张预览失败不影响主流程 */ }
  }
  if (!items.length) return;
  const totalSize = files.reduce((s, f) => s + (f.size || 0), 0);
  openModal(
    modalHead('🖼 已选择 ' + files.length + ' 张图片') +
    '<div class="m-body">' +
      '<div class="text-3" style="margin-bottom:10px">合计 ' + fmtBytes(totalSize) +
      ' · 将自动压缩至长边 1024px 后' + (S.cfg.skipCutout ? '<b style="color:var(--primary-deep)">直接入库（已开启跳过抠图）</b>' : '抠图') + '</div>' +
      '<div class="grid2">' + items.map((it) =>
        '<div class="item-card"><div class="thumb"><img src="' + it.dataUrl + '"></div>' +
        '<div class="info"><div class="tags">' + it.width + '×' + it.height + ' · ' + fmtBytes(it.size) + '</div></div></div>').join('') +
      '</div>' +
      '<button class="btn ghost small full mt12" id="pv-cancel">取消</button>' +
    '</div>',
    () => { $('#pv-cancel').addEventListener('click', closeModal); }
  );
}

    '</div>',
    () => {
      $$('.b-cat').forEach((btn) => btn.addEventListener('click', () => {

        $$('.b-cat[data-tmp="' + tmp + '"]').forEach((x) => x.classList.remove('on'));

      }));

      $('#batch-more').addEventListener('click', async () => {
        await commitBatch({ silent: true });

        const fi = $('#file-input');
        if (fi) { fi.value = ''; fi.click(); }
      });
    }
  );
}

async function commitBatch(opt = {}) {
  if (!S.batch.length) return;
  for (const b of S.batch) {
    const item = {
      id: uid(), name: b.name, cat: b.cat,
      colors: b.colors, mainColor: b.colors[0].name,
      fabric: b.fabric ? String(b.fabric).split(/[、,，]/).filter(Boolean) : [],
      style: b.style ? String(b.style).split(/[、,，]/).filter(Boolean) : [],
      season: b.season ? String(b.season).split(/[、,，]/).filter(Boolean) : [],
      scenes: [], fit: b.fit || '',
      status: 'active', full: b.img, thumb: b.thumb,
      w: b.w, h: b.h, simple: b.simple,
      createdAt: Date.now(), updatedAt: Date.now(),
    };
    await dbAdd('items', item);
    S.items.push(item);
  }
  const n = S.batch.length;
  S.batch = [];
  /* 复位上传状态，保证入口随时可用 */
  S.isUploading = false;
  closeModal();
  renderCloset();
  renderMatchTips();
  updateUploadButton();
  if (!opt.silent) {
    toast('✅ 新增 ' + n + ' 件单品，' + (S.cfg.skipCutout ? '已录入衣橱' : '抠图完成，已录入衣橱'), 'ok', 3200);
  }
}

/* ---------------- 渲染：衣橱 ---------------- */
function filteredItems() {
  const q = S.searchText.trim().toLowerCase();
  const adv = S.advFilters || {};
  const advN = countAdvFilters();
  return S.items.filter((it) => {
    if (S.filterCat !== 'all' && it.cat !== S.filterCat) return false;
    if (S.statusFilter === 'active' && it.status !== 'active') return false;
    if (S.statusFilter === 'idle' && it.status !== 'idle') return false;
    if (S.colorFilter && !it.colors.some((c) => c.name === S.colorFilter)) return false;
    if (S.fitFilter && it.fit !== S.fitFilter) return false;
    if (S.seasonFilter && !(it.season || []).includes(S.seasonFilter)) return false;
    /* v1.3 高级多条件筛选：同类内 OR，跨类 AND，可叠加原有筛选 */
    if (advN) {
      const seasons = adv.season || [], colors = adv.color || [], fabrics = adv.fabric || [], styles = adv.style || [];
      if (seasons.length && !seasons.some((v) => (it.season || []).includes(v) || v === '四季')) return false;
      if (colors.length && !colors.some((v) => (it.colors || []).some((c) => c.name === v) || it.mainColor === v)) return false;
      if (fabrics.length && !fabrics.some((v) => (it.fabric || []).includes(v))) return false;
      if (styles.length && !styles.some((v) => (it.style || []).includes(v))) return false;
    }
    if (q) {
      const hay = (it.name + ' ' + it.mainColor + ' ' + (it.style || []).join(' ') + ' ' + (it.fabric || []).join(' ') + ' ' + (it.scenes || []).join(' ') + ' ' + catOf(it.cat).name).toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
}

/* v1.3：统计当前生效的高级筛选条件数量（用于按钮角标） */
function countAdvFilters() {
  const a = S.advFilters || {};
  return ['season', 'color', 'fabric', 'style'].reduce((n, k) => n + ((a[k] || []).length ? 1 : 0), 0);
}

/* v1.3：重置全部筛选（含快捷标签、搜索框、高级筛选） */

  S.advFilters = { season: [], color: [], fabric: [], style: [] };

  S.filterCat = 'all';
}

    '<div class="closet-stats">' +

      '<div class="stat-box"><div class="n">' + (total - idle) + '</div><div class="l">✅ 在穿</div></div>' +
      '<div class="stat-box"><div class="n">' + idle + '</div><div class="l">💤 闲置</div></div>' +

      (S.isUploading ? '⏳ 正在处理…' : '➕ 继续上传单品') + '</button>' : '';
  const qUp = $('#quick-upload');
  if (qUp) qUp.addEventListener('click', () => {
    if (S.isUploading) { toast('⏳ 正在处理中，请稍候…', 'warn'); return; }

    if (fi) { fi.value = ''; fi.click(); }
  });

  const counts = {};

    CATS.map((c) => '<button class="chip' + (S.filterCat === c.key ? ' on' : '') + '" data-cat="' + c.key + '">' + c.emoji + ' ' + c.name + ' ' + counts[c.key] + '</button>').join('') +

    '<div class="u-t2">上传衣服图片即可<b style="color:var(--primary-deep)">自动抠图入库</b>，上传数量不限</div>' +
    '<button class="btn primary" id="hero-upload"' + (S.isUploading ? ' disabled' : '') + '>' +
      (S.isUploading ? '⏳ 处理中…' : '📷 上传第一件单品') + '</button></div>' : '';

/* ==================================================================
   模块2：AI 穿搭生成（本地引擎）
   ================================================================== */
function seasonOfTemp(t) { return t >= 26 ? '夏' : t >= 15 ? '春秋' : '冬'; }
function tempDesc(t) {
  if (t <= -5) return '严寒';
  if (t < 5) return '寒冷';
  if (t < 12) return '凉冷';
  if (t < 18) return '微凉';
  if (t < 24) return '舒适';
  if (t < 30) return '温暖';
  return '炎热';
}

function itemSeasonScore(it, season) {
  const tags = it.season || [];
  if (!tags.length || tags.includes('四季')) return 1;
  if (season === '春秋') return (tags.includes('春') || tags.includes('秋')) ? 1 : (tags.includes('夏') ? 0.55 : 0.45);
  if (tags.includes(season)) return 1;
  const opp = season === '夏' ? '冬' : '夏';
  return tags.includes(opp) ? 0.35 : 0.6;
}

function colorPairScore(names) {
  /* 返回 {score, label} */
  const fams = names.map(hueFamily);
  const neus = names.filter(isNeutralName).length;
  const distinct = new Set(fams.filter((f) => f !== 'none'));
  const colorful = names.filter((n) => !isNeutralName(n));
  if (!colorful.length) return { score: 4, label: '全中性色打底，干净耐看，怎么配都不出错' };
  if (distinct.size === 1) return { score: 4, label: '同色系深浅呼应，视觉顺滑，显高级还显高' };
  if (neus >= 1 && colorful.length === 1) return { score: 3.6, label: '中性色打底 + 一处彩色点亮，主次分明' };
  const arr = [...distinct];
  let near = false, clash = false;
  const order = ['red', 'orange', 'yellow', 'green', 'blue', 'purple'];
  if (arr.length === 2) {
    const d = Math.abs(order.indexOf(arr[0]) - order.indexOf(arr[1]));
    if (d === 1) near = true;
    if (d >= 3) clash = true;
  }
  if (near) return { score: 3.2, label: '邻近色柔和过渡，温柔又有层次' };
  if (clash) return { score: 2.8, label: '对比撞色大胆吸睛，时髦出片' };
  if (colorful.length > 2) return { score: 1.4, label: '彩色偏多，靠深浅平衡才不乱' };
  return { score: 3, label: '双色组合，清爽有记忆点' };
}

function paletteBonus(names, palette) {
  const ls = names.map(lightnessOfName);
  const fams = names.map(hueFamily);
  switch (palette) {
    case 'light': return ls.every((l) => l > 0.45) ? 2 : -0.8;
    case 'dark':  return ls.every((l) => l < 0.55) ? 2 : -0.8;
    case 'earth': return fams.every((f) => ['orange', 'yellow', 'none'].includes(f)) ? 2 : -0.6;
    case 'mono':  return new Set(fams.filter((f) => f !== 'none')).size <= 1 ? 2 : -0.6;
    case 'pop':   return names.filter((n) => !isNeutralName(n)).length === 1 ? 2 : -0.5;
    default: return 0.5;
  }
}

function genOutfitNote(items, temp, scene, style, palette, colorInfo) {
  const names = items.filter((i) => i.cat !== 'acc' && i.cat !== 'bag' && i.cat !== 'shoes').map((i) => i.mainColor);
  const allNames = items.map((i) => i.mainColor);
  const lines = [];
  lines.push('🌡 <b>' + temp + '°C ' + tempDesc(temp) + '</b>' + (temp < 16 ? '，外套随身备着不慌' : temp >= 26 ? '，面料选轻薄透气的' : '，单件/薄叠穿刚刚好'));
  lines.push('🎨 <b>色彩逻辑</b>：' + (colorInfo ? colorInfo.label : colorPairScore(allNames).label));
  const top = items.find((i) => i.cat === 'top');
  const bottom = items.find((i) => i.cat === 'bottom');
  if (top && bottom) {
    if (top.fit === '宽松' && bottom.fit === '宽松') lines.push('📏 <b>版型提醒</b>：上下都宽松会压身高，建议上衣塞一角或加腰带提高腰线');
    else if (top.fit === '宽松' && bottom.fit === '修身') lines.push('📏 <b>版型</b>：上松下紧，慵懒又显腿细');
    else if (top.fit === '修身' && bottom.fit === '宽松') lines.push('📏 <b>版型</b>：上紧下松，突出腰线，梨形身材友好');
  }
  const accs = items.filter((i) => i.cat === 'acc');
  lines.push('💍 <b>配饰思路</b>：' + (accs.length
    ? accs.map((a) => a.name).join('、') + ' 点到即止，精致感立刻上来'
    : '这身靠廓形取胜，配饰可省；想加就选小体量金属款提亮面部'));
  if (scene && scene !== '日常') {
    const map = { '通勤': '得体不费力，会议室到咖啡厅都稳', '约会': '柔和有氛围感，拍照也上镜', '出游': '舒服好走，出片和实用兼得', '拍照': '色彩和层次都有了，镜头感拉满', '运动': '活动自如，机能感十足', '宴会': '优雅压场，细节见质感', '度假': '松弛感满分，怎么拍都像大片', '居家': '松弛舒适，取快递也体面' };
    lines.push('🎯 <b>场景适配</b>：' + (map[scene] || scene + '友好'));
  }
  if (style) lines.push('✨ 风格关键词：<b>' + style + '</b>' + (palette && palette !== 'any' ? ' · ' + (PALETTES.find((p) => p.key === palette) || {}).name : ''));
  return lines;
}

function generateOutfits(opts) {
  const { temp, scene, style, palette, avoid, lockItem, count } = opts;
  const season = seasonOfTemp(temp);
  /* v1.3：默认只调用在穿单品；勾选「包含闲置」后闲置单品才会进入候选 */
  const active = activePool();
  const avoidSet = new Set(avoid || []);
  (S.profile.avoidColors || []).forEach((c) => avoidSet.add(c));
  const ok = (it) => (it.status === 'active' || S.includeIdle) && !avoidSet.has(it.mainColor) &&
    !(S.profile.avoidFits || []).includes(it.fit || '');
  const pool = {};
  CATS.forEach((c) => pool[c.key] = active.filter((i) => i.cat === c.key && ok(i)));
  if (lockItem) {
    pool[lockItem.cat] = pool[lockItem.cat] || [];
    if (!pool[lockItem.cat].includes(lockItem)) pool[lockItem.cat].push(lockItem);
  }

  const scoreItem = (it) => {
    let s = 1;
    s *= itemSeasonScore(it, season);
    if (scene && (it.scenes || []).includes(scene)) s += 2;
    if (style && (it.style || []).includes(style)) s += 1.6;
    if (isNeutralName(it.mainColor)) s += 0.8;
    s += (it.style || []).length * 0.05 + (it.scenes || []).length * 0.05;
    return s;
  };
  const sortByScore = (arr) => arr.map((it) => ({ it, s: scoreItem(it) + Math.random() * 1.6 })).sort((a, b) => b.s - a.s).map((x) => x.it);

  const needCoat = temp < 16;
  const combos = [];
  const tops = sortByScore(pool.top || []);
  const bottoms = sortByScore(pool.bottom || []);
  const dresses = sortByScore(pool.dress || []);
  const coats = sortByScore(pool.coat || []);
  const shoes = sortByScore(pool.shoes || []);
  const bags = sortByScore(pool.bag || []);
  const accs = sortByScore(pool.acc || []);

  const buildSet = (mainArr, useCoat) => {
    const set = [...mainArr];
    if (useCoat && coats.length) set.push(coats[Math.floor(Math.random() * Math.min(3, coats.length))]);
    if (shoes.length) set.push(shoes[Math.floor(Math.random() * Math.min(3, shoes.length))]);
    if (bags.length && Math.random() < 0.65) set.push(bags[Math.floor(Math.random() * Math.min(2, bags.length))]);
    const accN = accs.length ? (Math.random() < 0.45 ? 1 : Math.random() < 0.12 ? 2 : 0) : 0;
    for (let i = 0; i < accN && i < accs.length; i++) set.push(accs[Math.floor(Math.random() * accs.length)]);
    return set;
  };

  /* 候选集合 */
  const cands = [];
  if (lockItem) {
    if (lockItem.cat === 'dress') dresses.unshift(lockItem);
    if (lockItem.cat === 'top') tops.unshift(lockItem);
    if (lockItem.cat === 'bottom') bottoms.unshift(lockItem);
    if (lockItem.cat === 'coat') coats.unshift(lockItem);
    if (lockItem.cat === 'shoes') shoes.unshift(lockItem);
    if (lockItem.cat === 'bag') bags.unshift(lockItem);
    if (lockItem.cat === 'acc') accs.unshift(lockItem);
  }
  dresses.slice(0, 6).forEach((d) => cands.push(buildSet([d], needCoat)));
  const tN = Math.min(tops.length, 8), bN = Math.min(bottoms.length, 8);
  for (let i = 0; i < tN; i++) {
    for (let j = 0; j < bN; j++) {
      if (i < 4 || j < 4) cands.push(buildSet([tops[i], bottoms[j]], needCoat));
    }
  }

  /* 评分 */
  const scored = cands.map((set) => {
    const names = set.map((i) => i.mainColor);
    const cp = colorPairScore(names);
    let s = cp.score * 2 + paletteBonus(names, palette) * 1.5 + set.reduce((a, i) => a + scoreItem(i), 0);
    if (names.filter((n) => !isNeutralName(n)).length > 2) s -= 3;
    if (lockItem && set.includes(lockItem)) s += 6;
    return { set, s, cp };
  }).filter((x) => x.set.length >= 2).sort((a, b) => b.s - a.s);

  /* 去重 + 多样性挑选 */
  const picked = [];
  const usedMain = new Set();
  for (const cand of scored) {
    const main = cand.set.filter((i) => ['top', 'bottom', 'dress'].includes(i.cat)).map((i) => i.id).sort().join('+');
    const dupKey = main;
    if (picked.some((p) => p.dupKey === dupKey)) continue;
    if (usedMain.has(cand.set[0].id) && picked.length < count) continue; // 主衣尽量不重复
    picked.push(Object.assign({ dupKey }, cand));
    cand.set.filter((i) => ['top', 'bottom', 'dress'].includes(i.cat)).forEach((i) => usedMain.add(i.id));
    if (picked.length >= count) break;
  }
  /* 放宽主衣限制再补 */
  for (const cand of scored) {
    if (picked.length >= count) break;
    const main = cand.set.filter((i) => ['top', 'bottom', 'dress'].includes(i.cat)).map((i) => i.id).sort().join('+');
    if (picked.some((p) => p.dupKey === main)) continue;
    picked.push(Object.assign({ dupKey: main }, cand));
  }
  return picked.slice(0, count);
}

function renderOutfitCard(o, idx, temp, scene, style, palette) {
  const items = o.set;
  const noteLines = genOutfitNote(items, temp, scene, style, palette, o.cp);
  const lookHtml = items.map((i) =>
    '<div class="o-look"><img src="' + i.thumb + '" loading="lazy"><div class="cat-dot">' + catOf(i.cat).emoji + ' ' + esc(i.name) + '</div></div>').join('');
  const paletteName = palette && palette !== 'any' ? ' · ' + (PALETTES.find((p) => p.key === palette) || {}).name : '';
  return '<div class="outfit-card">' +
    '<div class="o-head"><div class="o-title">✨ 穿搭 ' + (idx + 1) +
      (scene && scene !== '日常' ? ' · ' + scene : '') + paletteName + '</div>' +
      '<span class="chip mini">' + tempDesc(temp) + '</span></div>' +
    '<div class="o-looks">' + lookHtml + '</div>' +
    '<div class="o-note">' + noteLines.map((l) => '· ' + l).join('<br>') + '</div>' +
    '<div class="o-acts">' +
      '<button class="btn small primary" data-act="save" data-idx="' + idx + '">💾 保存方案</button>' +
      '<button class="btn small" data-act="plan" data-idx="' + idx + '">📅 排期到某天</button>' +
    '</div></div>';
}

function onGenerate(count) {
  const usable = activePool().filter((i) => i.status === 'active' || S.includeIdle);
  const idleN = S.items.filter((i) => i.status === 'idle').length;
  if (usable.length < 2) {
    toast('🫧 可用单品还不够（至少 2 件），先去上传吧' + (idleN && !S.includeIdle ? '，或在上方勾选「包含闲置」' : ''), 'warn', 3400);
    switchView('closet'); return;
  }
  const temp = Number($('#m-temp').value);
  const scene = collectChips('#m-scene', false) || '日常';
  const style = collectChips('#m-style', false);
  const palette = collectChips('#m-palette', false) || 'any';
  const avoid = collectChips('#m-avoid', true);
  const city = $('#m-city').value.trim();

  const results = generateOutfits({ temp, scene, style, palette, avoid, lockItem: S.lockItem, count });
  const box = $('#match-results');
  if (!results.length) {
    box.innerHTML = '<div class="empty"><div class="e-emoji">🤔</div><div class="e-tips">当前筛选条件下没凑出搭配<br>试试放宽避雷颜色，或补充几件上衣/下装</div></div>';
    return;
  }
  const head = '<div class="card" style="background:linear-gradient(135deg,#FBF3EA,#F6EBDD)">' +
    '<div class="card-title">📋 本批穿搭报告</div>' +
    '<table class="md-table"><tr><th>条件</th><th>' + (city ? esc(city) + ' · ' : '') + temp + '°C ' + tempDesc(temp) + ' · ' + scene + (style ? ' · ' + style : '') + '</th></tr>' +
    '<tr><th>避雷</th><td>' + (avoid.length ? avoid.join('、') + (S.profile.avoidColors.length ? '（含档案避雷）' : '') : '无') + '</td></tr>' +
    '<tr><th>共生成</th><td><b>' + results.length + ' 套</b>' + (count === 7 ? ' · 未来 7 天可直接排期' : '') + '</td></tr></table></div>';
  box.innerHTML = head + results.map((o, i) => renderOutfitCard(o, i, temp, scene, style, palette)).join('');

  box.querySelectorAll('[data-act]').forEach((btn) => btn.addEventListener('click', () => {
    const o = results[Number(btn.dataset.idx)];
    if (btn.dataset.act === 'save') saveOutfit(o, temp, scene);
    else planOutfitToDay(o);
  }));
  if (count === 7) {
    box.insertAdjacentHTML('beforeend', '<button class="btn primary full" id="week7-plan">📅 一键排期未来 7 天（明天开始）</button>');
    $('#week7-plan').addEventListener('click', async () => {
      let worn = 0;
      for (let i = 0; i < results.length; i++) {
        const d = new Date(); d.setDate(d.getDate() + 1 + i);
        const ds = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
        const ids = results[i].set.map((x) => x.id);
        await dbAdd('schedule', { id: uid(), date: ds, title: '7天不重样 · Day ' + (i + 1), itemIds: ids });
        /* v1.3：写入日程即触发对应单品穿着次数 +1 */
        worn += await bumpWearCounts(ids);
      }
      S.schedule = await dbAll('schedule');
      toast('📅 已排期未来 ' + results.length + ' 天，去「日程」看看吧（' + worn + ' 件次穿着已计数）', 'ok', 3400);
      renderSchedule(); renderCloset(); renderCalendar();
    });
  }
  box.scrollIntoView({ behavior: 'smooth' });
  toast('✨ 已生成 ' + results.length + ' 套穿搭', 'ok');
}

async function saveOutfit(o, temp, scene) {
  const name = prompt('给这套穿搭起个名字：', (scene || '日常') + ' · ' + o.set[0].name);
  if (name === null) return;
  const outfit = {
    id: uid(), name: name || '未命名穿搭', itemIds: o.set.map((i) => i.id),
    note: genOutfitNote(o.set, temp, scene, '', 'any', o.cp).join(' / '), createdAt: Date.now(),
  };
  await dbAdd('outfits', outfit);
  S.outfits.push(outfit);
  toast('💾 穿搭方案已保存，可在「日程」中排期', 'ok', 3000);
}

function renderSchedule() {
  $('#t-scenes').innerHTML = SCENES.map((v) => '<button class="chip' + (v === '日常' || v === '出游' ? ' on' : '') + '" data-v="' + v + '">' + v + '</button>').join('');
  $$('#t-scenes .chip').forEach((c) => c.addEventListener('click', () => {
    $$('#t-scenes .chip').forEach((x) => x.classList.remove('on'));
    c.classList.add('on');
  }));
  const list = [...S.schedule].sort((a, b) => a.date < b.date ? -1 : 1);
  const el = $('#schedule-list');
  if (!list.length) {
    el.innerHTML = '<div class="empty"><div class="e-emoji">🗓</div><div class="e-tips">还没有穿搭日程<br>点击「规划一天」，或从穿搭生成页排期</div></div>';
    return;
  }
  el.innerHTML = list.map((ev) => {
    const { m, d, wd } = fmtDate(ev.date);
    const items = (ev.itemIds || []).map((id) => S.items.find((i) => i.id === id)).filter(Boolean);
    const looks = items.map((i) => '<img src="' + i.thumb + '" loading="lazy">').join('');
    return '<div class="day-card"><div class="d-head">' +
      '<div class="d-date"><div class="dd">' + d + '</div><div class="dw">' + m + '月·周' + wd + '</div></div>' +
      '<div class="d-title">' + (ev.title ? esc(ev.title) : '穿搭安排') + '</div>' +
      '<button class="icon-btn" data-del="' + ev.id + '" style="width:30px;height:30px;font-size:12px">🗑</button></div>' +
      (looks ? '<div class="d-looks">' + looks + '</div>' : '<div class="d-empty-tip">单品可能已被删除</div>') +
    '</div>';
  }).join('');
  el.querySelectorAll('[data-del]').forEach((b) => b.addEventListener('click', async () => {
    if (!confirm('删除这条日程？')) return;
    await dbDel('schedule', b.dataset.del);
    S.schedule = await dbAll('schedule');
    renderSchedule(); renderCalendar(); toast('🗑 日程已删除', 'ok');
  }));
}

/* ---------- 旅行打包 ---------- */
function onPack() {
  const dest = $('#t-dest').value.trim() || '目的地';
  const days = Number($('#t-days').value);
  const lo = Number($('#t-lo').value), hi = Number($('#t-hi').value);
  const scenes = $$('#t-scenes .chip.on').map((c) => c.dataset.v);
  const avg = (lo + hi) / 2;
  const season = seasonOfTemp(avg);
  /* v1.3：默认排除闲置单品；在穿搭页勾选「包含闲置」后同样对打包生效 */
  const okItems = usableItems();
  const pool = (cat) => okItems.filter((i) => i.cat === cat && itemSeasonScore(i, season) >= 0.6);
  const idleN = S.items.filter((i) => i.status === 'idle').length;

  const pickBy = (arr, n, extraScore) => arr
    .map((i) => ({ i, s: itemSeasonScore(i, season) * 2 + (isNeutralName(i.mainColor) ? 1.2 : 0.4) + (scenes.some((sc) => (i.scenes || []).includes(sc)) ? 1.5 : 0) + (extraScore ? extraScore(i) : 0) }))
    .sort((a, b) => b.s - a.s).slice(0, n).map((x) => x.i);

  const tops = pickBy(pool('top'), Math.min(pool('top').length, Math.ceil(days * 0.8) + 1));
  const bottoms = pickBy(pool('bottom'), Math.min(pool('bottom').length, Math.max(1, Math.ceil(days / 2.5))));
  const dresses = pickBy(pool('dress'), scenes.some((s) => ['约会', '拍照', '度假', '宴会'].includes(s)) ? Math.min(pool('dress').length, 2) : 0);
  const coats = lo < 18 ? pickBy(pool('coat'), lo < 8 ? Math.min(pool('coat').length, 2) : 1) : [];
  const shoes = pickBy(pool('shoes'), Math.min(pool('shoes').length, 2));
  const bags = pickBy(pool('bag'), Math.min(pool('bag').length, 1));
  const accs = pickBy(pool('acc'), Math.min(pool('acc').length, 2));

  const groups = [
    ['👕', '上衣', tops, '可互相轮换，脏了夜间手洗晾干'],
    ['👖', '下装', bottoms, '一件下装可配 2–3 件上衣'],
    ['👗', '连衣裙', dresses, dresses.length ? '省心一秒出门，约会拍照场合备上' : ''],
    ['🧥', '外套', coats, lo < 8 ? '早晚温差大，厚外套必备' : lo < 18 ? '备一件应对降温' : ''],
    ['👟', '鞋履', shoes, '一双走路 + 一双出片，最多两双'],
    ['👜', '包包', bags, '选能装下随身物的斜挎/托特'],
    ['💍', '配饰', accs, '小体积大加分，别忘了'],
  ];
  const chosen = groups.reduce((s, g) => s + g[2].length, 0);
  const combos = tops.length * Math.max(1, bottoms.length) + dresses.length;

  let rows = '';
  groups.forEach((g) => {
    if (g[2].length) {
      rows += '<tr><th>' + g[0] + ' ' + g[1] + '</th><td>' +
        g[2].map((i) => '<span class="chip mini on">' + esc(i.name) + '</span>').join(' ') +
        (g[3] ? '<div class="text-3" style="margin-top:4px">' + g[3] + '</div>' : '') + '</td></tr>';
    }
  });
  rows += '<tr><th>🧦 通用清单</th><td>内衣 ' + days + ' 套 · 袜子 ' + days + ' 双 · 睡衣 1 套' + (scenes.includes('出游') || scenes.includes('度假') ? ' · 防晒帽/墨镜' : '') + (scenes.includes('运动') ? ' · 运动内衣' : '') + '</td></tr>';

  const el = $('#pack-result');
  el.innerHTML = '<div class="card">' +
    '<div class="card-title">🧳 ' + esc(dest) + ' · ' + days + ' 天行李清单 <span class="sub">' + lo + '~' + hi + '°C</span></div>' +
    '<table class="md-table">' + rows + '</table>' +

/* ==================================================================
   v1.3 功能3：穿搭历史记录（月视图日历 + 月度统计）
   数据源：已保存到「日程」的穿搭记录（S.schedule），全部本地运算
   AI 生成页上方草稿不计入本模块统计
   ================================================================== */
const CAL_WEEK_LABEL = ['日', '一', '二', '三', '四', '五', '六'];

/* 取出某个月份的日程记录，按日期分组 */
function scheduleOfMonth(y, m) {
  const prefix = y + '-' + String(m).padStart(2, '0');
  const map = {};
  S.schedule.forEach((ev) => {
    if (!ev.date || ev.date.slice(0, 7) !== prefix) return;
    (map[ev.date] = map[ev.date] || []).push(ev);
  });
  return map;
}

/* 某天涉及的全部单品（去重，按当日出现次数降序） */
function itemsOfDay(evs) {
  const cnt = {};
  (evs || []).forEach((ev) => (ev.itemIds || []).forEach((id) => cnt[id] = (cnt[id] || 0) + 1));
  return Object.keys(cnt).map((id) => ({ it: S.items.find((i) => i.id === id), c: cnt[id] })).filter((x) => x.it);
}

function calShift(delta) {
  let y = S.calYear, m = S.calMonth + delta;
  if (m < 1) { m = 12; y--; }
  if (m > 12) { m = 1; y++; }
  S.calYear = y; S.calMonth = m;
  renderCalendar();
}

function renderCalendar() {
  const grid = $('#cal-grid');
  if (!grid) return;
  const y = S.calYear, m = S.calMonth;
  const map = scheduleOfMonth(y, m);

  /* 月度统计（全部本地运算） */
  const monthEvs = Object.keys(map).reduce((a, k) => a.concat(map[k]), []);
  const wearTotal = monthEvs.length;
  const itemCnt = {};
  monthEvs.forEach((ev) => (ev.itemIds || []).forEach((id) => itemCnt[id] = (itemCnt[id] || 0) + 1));
  const itemTotal = Object.keys(itemCnt).length;
  const top3 = Object.keys(itemCnt)
    .map((id) => ({ it: S.items.find((i) => i.id === id), c: itemCnt[id] }))
    .filter((x) => x.it)
    .sort((a, b) => b.c - a.c || ((b.it.wearCount || 0) - (a.it.wearCount || 0)))
    .slice(0, 3);

  const tip = $('#cal-month-tip');
  if (tip) tip.textContent = y + ' 年 ' + m + ' 月';
  const title = $('#cal-title');
  if (title) title.textContent = y + ' 年 ' + m + ' 月';
  $('#cal-stats').innerHTML =
    '<div class="cal-stat"><div class="n">' + wearTotal + '</div><div class="l">本月穿搭总次数</div></div>' +
    '<div class="cal-stat"><div class="n">' + itemTotal + '</div><div class="l">穿过衣物件数</div></div>' +
    '<div class="cal-stat"><div class="n">' + (top3.length ? top3[0].c : 0) + '</div><div class="l">最高单品次数</div></div>';

  /* 月视图网格：首日留白 + 当月天数 */
  const first = new Date(y, m - 1, 1).getDay();
  const days = new Date(y, m, 0).getDate();
  const today = todayStr();
  let html = '';
  for (let i = 0; i < first; i++) html += '<div class="cal-cell blank"></div>';
  for (let d = 1; d <= days; d++) {
    const ds = y + '-' + String(m).padStart(2, '0') + '-' + String(d).padStart(2, '0');
    const evs = map[ds] || [];
    const its = itemsOfDay(evs);
    const cls = 'cal-cell' + (evs.length ? ' has' : '') + (ds === today ? ' today' : '');
    const inner = evs.length
      ? (its[0] ? '<img src="' + its[0].it.thumb + '" loading="lazy">' : '') +
        '<span class="cal-day-num">' + d + '</span>' +
        '<span class="cal-badge">' + (its.length || evs.length) + ' 件</span>'
      : '<span class="cal-day-num" style="position:static">' + d + '</span>';
    html += '<div class="' + cls + '"' + (evs.length ? ' data-date="' + ds + '"' : '') + '>' + inner + '</div>';
  }
  grid.innerHTML = html;

  /* 高频单品 TOP3 */
  const topBox = $('#cal-top');
  if (topBox) {
    topBox.innerHTML = top3.length
      ? '<div class="card-title">🔥 高频穿着单品 TOP3</div>' + top3.map((t, i) =>
          '<div class="top-item">' +
            '<div class="t-rank">' + (i + 1) + '</div>' +
            '<img class="t-img" src="' + t.it.thumb + '" loading="lazy">' +
            '<div class="t-info"><div class="t-nm">' + esc(t.it.name) + '</div>' +
              '<div class="t-sub">' + catOf(t.it.cat).emoji + ' ' + catOf(t.it.cat).name + ' · 累计 ' + (t.it.wearCount || 0) + ' 次</div></div>' +
            '<div class="t-cnt">本月 ' + t.c + ' 次</div>' +
          '</div>').join('')
      : '<div class="text-3">本月还没有穿搭记录，把生成的穿搭「保存到日程」后就会出现在这里 ✨</div>';
  }

  /* 点击日期格子查看当天的整套穿搭详情 */
  grid.querySelectorAll('[data-date]').forEach((cell) => cell.addEventListener('click', () => openDayDetail(cell.dataset.date)));
}

/* 某一天的穿搭详情弹窗 */
function openDayDetail(ds) {
  const evs = S.schedule.filter((ev) => ev.date === ds);
  if (!evs.length) return;
  const { m, d, wd } = fmtDate(ds);
  const body = evs.map((ev) => {
    const its = itemsOfDay([ev]).map((x) => x.it);
    const looks = its.length
      ? '<div class="d-looks" style="margin-top:8px">' + its.map((i) => '<img src="' + i.thumb + '" loading="lazy">').join('') + '</div>'
      : '<div class="d-empty-tip">单品可能已被删除</div>';
    const tagRows = its.length
      ? '<table class="md-table mt8">' + its.map((i) =>
          '<tr><th style="width:96px">' + catOf(i.cat).emoji + ' ' + esc(i.name) + '</th><td>' +
          '<span class="chip mini on">' + esc(i.mainColor || '') + '</span> ' +
          ((i.style || [])[0] ? '<span class="chip mini">' + esc(i.style[0]) + '</span> ' : '') +
          '<span class="text-3">累计穿着 ' + (i.wearCount || 0) + ' 次</span>' +
          '</td></tr>').join('') + '</table>'
      : '';
    return '<div class="advice-item" style="flex-direction:column;gap:0;background:var(--cream);border-radius:14px;padding:12px;margin-bottom:10px">' +
      '<div class="bold" style="font-size:13.5px">' + (ev.title ? esc(ev.title) : '穿搭安排') + '</div>' +
      looks + tagRows + '</div>';
  }).join('');
  openModal(
    modalHead('📖 ' + m + ' 月 ' + d + ' 日 · 周' + wd) +
    '<div class="m-body">' + body +
      '<div class="text-3">共 ' + evs.length + ' 条日程记录</div>' +
      '<button class="btn full mt12" id="day-close">知道了</button>' +

}

async function runDiagnose() {
  const issueKeys = $$('#diag-issues .chip.on').map((c) => c.dataset.v);
  const itemIds = $$('#diag-items .chip.on').map((c) => c.dataset.id);
  const height = Number($('#diag-height').value) || 0;
  const items = itemIds.map((id) => S.items.find((i) => i.id === id)).filter(Boolean);
  const photo = S.diagDraft;

  const out = [];
  /* 配色自动分析 */
  if (items.length >= 2) {
    const names = items.map((i) => i.mainColor);
    const cp = colorPairScore(names);
    const colorful = names.filter((n) => !isNeutralName(n));
    out.push('<h5>🎨 配色诊断</h5><ul>');
    out.push('<li>本套用色：<b>' + names.join(' × ') + '</b> —— ' + cp.label + '</li>');
    if (colorful.length > 2) out.push('<li>⚠️ 全身彩色超过 3 处，建议<b>做减法</b>：保留 1 个主彩色，其余换中性色</li>');
    const ls = names.map(lightnessOfName);
    if (ls.every((l) => l > 0.55) || ls.every((l) => l < 0.4)) out.push('<li>⚠️ 全身明度接近，层次偏平 —— 加入一件深浅反差单品（如深色下装）立刻立体</li>');
    out.push('</ul>');
  } else {
    out.push('<h5>🎨 配色诊断</h5><ul><li>未关联衣橱单品。下次上传时勾选本套单品，可自动分析配色逻辑 💡</li></ul>');
  }
  /* 版型分析 */
  const top = items.find((i) => i.cat === 'top'), bottom = items.find((i) => i.cat === 'bottom');
  out.push('<h5>👗 版型 & 身材适配</h5><ul>');
  if (top && bottom) {
    if (top.fit === '宽松' && bottom.fit === '宽松') out.push('<li>⚠️ 上下皆宽松 —— 这是<b>显胖压身高</b>的第一组合。微调：上衣前摆塞进腰头，或换成修身下装</li>');
    else if (top.fit === '宽松' && bottom.fit === '修身') out.push('<li>✅ 上松下紧，比例正确，显瘦显腿细</li>');
    else if (top.fit === '修身' && bottom.fit === '宽松') out.push('<li>✅ 上紧下松，腰线清晰，梨形身材友好</li>');
    else if (top.fit && bottom.fit) out.push('<li>✅ 上下廓形平衡，可尝试再加一条腰带优化比例</li>');
    else out.push('<li>💡 建议在单品详情补充「版型」标签，诊断会更精准</li>');
  } else {
    out.push('<li>💡 在衣橱中为本套单品补全<b>版型</b>与<b>颜色</b>标签，可获得逐项分析</li>');
  }
  if (height && height < 160) out.push('<li>📏 身高 ' + height + 'cm：<b>高腰线是第一原则</b>，鞋裤同色延伸，轻松显高 3–5cm</li>');
  out.push('</ul>');
  /* 困扰建议 */
  if (issueKeys.length) {
    out.push('<h5>💡 针对你的困扰 · 微调建议</h5><ul>');
    issueKeys.forEach((k) => {
      const iss = ISSUES.find((i) => i.key === k);
      if (iss) out.push('<li><b>' + iss.name + '</b>：' + ISSUE_ADVICE[k][Math.floor(Math.random() * ISSUE_ADVICE[k].length)] + '</li>');
    });
    out.push('</ul>');
  } else {
    out.push('<h5>💡 微调建议</h5><ul><li>没有勾选困扰 —— 想要更狠的点评就大胆勾上 😏</li></ul>');
  }
  const report = out.join('');

  const record = { id: uid(), date: todayStr(), photo, report, issueKeys, itemIds, height, createdAt: Date.now() };
  await dbAdd('kv', { k: 'diag_' + record.id, v: record });
  S.diagRecords = S.diagRecords || [];
  S.diagRecords.push(record);

  $('#diag-result').innerHTML = '<div class="card"><div class="card-title">🔍 诊断报告 <span class="sub">' + record.date + '</span></div>' +
    (photo ? '<img class="diag-photo" src="' + photo + '">' : '') +
    '<div class="diag-report">' + report + '</div>' +
    '<div class="flex mt12" style="gap:8px;flex-wrap:wrap">' +
      '<button class="btn small" id="dg-avoid-color">🚫 以后避开这类颜色</button>' +
      '<button class="btn small" id="dg-avoid-fit">🚫 以后避开这类版型</button>' +
    '</div></div>';
  $('#dg-avoid-color').addEventListener('click', () => openAvoidPicker('colors'));
  $('#dg-avoid-fit').addEventListener('click', () => openAvoidPicker('fits'));
  $('#diag-result').scrollIntoView({ behavior: 'smooth' });
  toast('🔍 诊断完成！喜好会自动应用到穿搭生成', 'ok', 3000);
  renderDiagHistory();
}

function openAvoidPicker(kind) {
  const isColor = kind === 'colors';
  const options = isColor ? COLOR_CHIPS : FITS;
  const cur = isColor ? (S.profile.avoidColors || []) : (S.profile.avoidFits || []);
  openModal(
    modalHead(isColor ? '🚫 避雷颜色档案' : '🚫 避雷版型档案') +
    '<div class="m-body">' +
      '<div class="text-3" style="margin-bottom:10px">选中的内容会记入<b style="color:var(--primary-deep)">喜好档案</b>，之后 AI 生成穿搭会自动避开</div>' +
      '<div class="chips">' + options.map((v) => '<button class="chip' + (cur.includes(v) ? ' on' : '') + '" data-v="' + v + '">' + v + '</button>').join('') + '</div>' +
      '<button class="btn primary full mt12" id="av-save">💾 保存档案</button>' +
    '</div>',
    () => {
      $$('.modal .chip[data-v]').forEach((c) => c.addEventListener('click', () => {
        if ($$('.modal .chip.on[data-v="' + c.dataset.v + '"]').length) c.classList.remove('on');
        $$('.modal .chip[data-v="' + c.dataset.v + '"]').forEach((x) => x.classList.remove('on'));
        c.classList.toggle('on');
      }));
      $('#av-save').addEventListener('click', async () => {
        const picked = $$('.modal .chip.on').map((c) => c.dataset.v);
        if (isColor) S.profile.avoidColors = picked; else S.profile.avoidFits = picked;
        await dbPut('profile', { k: 'main', v: S.profile });
        closeModal();
        toast('🚫 避雷档案已更新：' + (picked.length ? picked.join('、') : '已清空'), 'ok', 3000);
        renderMatch();
      });
    }
  );
}

      '<div class="i-info">' + tag + '<div class="i-note">' + esc(ins.note || '') + linked + '</div>' +
      (isItem && !ins.linkedItemId ? '<button class="btn small" data-link="' + ins.id + '">🔗 关联已有</button>' : '') +
      '<button class="i-x" data-del-inspo="' + ins.id + '">✕</button></div></div>';
  }).join('');
  el.querySelectorAll('[data-del-inspo]').forEach((b) => b.addEventListener('click', async (e) => {
    e.stopPropagation();
    await dbDel('inspirations', b.dataset.delInspo);
    S.inspirations = await dbAll('inspirations');
    renderInspo(); toast('🗑 已删除', 'ok');
  }));
  el.querySelectorAll('[data-link]').forEach((b) => b.addEventListener('click', () => {
    const ins = S.inspirations.find((x) => x.id === b.dataset.link);
    if (!ins) return;
    const opts = S.items.map((i) => '<button class="chip mini" data-lid="' + i.id + '">' + catOf(i.cat).emoji + ' ' + esc(i.name) + '</button>').join('');
    openModal(modalHead('🔗 关联到衣橱单品') +
      '<div class="m-body"><div class="chips">' + opts + '</div>' +
      '<button class="btn small ghost mt12" id="link-none">取消关联</button></div>',
      () => {
        $$('.modal .chip[data-lid]').forEach((c) => c.addEventListener('click', async () => {
          ins.linkedItemId = c.dataset.lid;
          ins.have = true;
          await dbPut('inspirations', ins);
          S.inspirations = await dbAll('inspirations');
          closeModal(); renderInspo();
          toast('✅ 已标记【已有衣橱】', 'ok');
        }));
        $('#link-none').addEventListener('click', closeModal);
      });
  }));
}

async function handleInspoFiles(files) {
  const imgs = Array.from(files).filter((f) => f.type.startsWith('image/'));
  if (!imgs.length) return;
  for (const f of imgs) {
    try {
      const im = await loadImageFile(f);
      const photo = await compressPhoto(im, 1000, 0.8);
      const type = S.inspoType;
      let note = '';
      if (type === 'item') {
        note = prompt('简单描述这件单品（如：白色法式衬衫）', '') || '';
      } else {
        note = prompt('为什么种草这套？（可留空）', '') || '';
      }
      await dbAdd('inspirations', { id: uid(), type, photo, note, linkedItemId: null, createdAt: Date.now() });
    } catch (e) { /* skip */ }
  }
  S.inspirations = await dbAll('inspirations');
  renderInspo();
  toast('💡 已收进灵感收集箱（' + (S.inspoType === 'item' ? '意向单品' : '种草穿搭') + '）', 'ok', 2800);
}

/* ==================================================================
   衣橱自动分析（精简 & 补货建议）
   ================================================================== */
async function runAnalyze() {
  const items = S.items;
  if (!items.length) { toast('🫧 衣橱还是空的，先上传几件单品吧', 'warn', 3000); switchView('closet'); return; }
  const idle = items.filter((i) => i.status === 'idle');
  const catCount = {};
  CATS.forEach((c) => catCount[c.key] = items.filter((i) => i.cat === c.key).length);
  const colorCount = {};
  items.forEach((i) => { colorCount[i.mainColor] = (colorCount[i.mainColor] || 0) + 1; });
  const topColors = Object.entries(colorCount).sort((a, b) => b[1] - a[1]).slice(0, 5);
  const month = new Date().getMonth() + 1;
  const nowSeason = month >= 5 && month <= 9 ? '夏' : month === 3 || month === 4 ? '春' : month >= 10 ? '秋' : '冬';
  const seasonItems = items.filter((i) => (i.season || []).includes(nowSeason) || (i.season || []).includes('四季') || !(i.season || []).length);

  const tableRows = CATS.map((c) =>
    '<tr><th>' + c.emoji + ' ' + c.name + '</th><td><b>' + catCount[c.key] + '</b> 件' + (catCount[c.key] === 0 ? ' · ⚠️ 空缺' : '') + '</td></tr>').join('') +
    '<tr><th>💤 闲置</th><td><b>' + idle.length + '</b> 件（' + Math.round(idle.length / items.length * 100) + '%）</td></tr>';

  const advice = [];
  /* 补货建议 */
  CATS.forEach((c) => {
    if (catCount[c.key] === 0) {
      const why = { top: '上衣是搭配核心，建议优先补 2–3 件基础款', bottom: '缺下装上衣再美也难成套，先补 1–2 条', coat: '降温就慌，建议备 1 件百搭外套', dress: '约会/度假一秒出门就靠它，按需补', shoes: '再好看的穿搭也怕没鞋收尾，建议补 1–2 双', bag: '通勤出游都需要，一只托特/斜挎就能打', acc: '小配饰大作用，耳饰/丝巾闭眼入' };
      advice.push(['🛒', '<b>补货建议</b>：' + c.name + '目前为 0。' + why[c.key]]);
    }
  });
  /* 精简建议 */
  const maxCat = Object.entries(catCount).sort((a, b) => b[1] - a[1])[0];
  if (maxCat && maxCat[1] >= Math.max(4, items.length * 0.4)) {
    advice.push(['✂️', '<b>精简建议</b>：' + catOf(maxCat[0]).name + '有 ' + maxCat[1] + ' 件，占比偏高。同类超过 6 件时利用率会下降，闲置的那几件可以考虑断舍离 🧘']);
  }
  if (idle.length >= 3 || (idle.length / items.length > 0.3 && items.length >= 5)) {
    advice.push(['💤', '<b>激活闲置</b>：已有 ' + idle.length + ' 件闲置。去「穿搭」页生成搭配试试激活它们；确实不爱的就出二手吧～']);
  }
  if (topColors[0] && topColors[0][1] / items.length > 0.55) {
    advice.push(['🎨', '<b>色彩平衡</b>：' + topColors[0][0] + '色单品占了 ' + Math.round(topColors[0][1] / items.length * 100) + '%，衣橱略显单一，补 1–2 件大地色或彩色会更耐搭']);
  }
  if (items.every((i) => isNeutralName(i.mainColor)) && items.length >= 4) {
    advice.push(['🌈', '<b>出彩建议</b>：目前全是中性色（优点：随便配），但也少了点记忆点，拍照穿搭可以加 1 件彩色单品']);
  }
  if (seasonItems.length < 3) {
    advice.push(['🍂', '<b>当季提醒</b>：现在是<b>' + nowSeason + '季</b>，适合本季的单品偏少（' + seasonItems.length + ' 件），换季采购可以安排上']);
  }
  if (!advice.length) advice.push(['🎉', '结构相当健康！类目均衡、闲置率低。下一步可以试试「7 天穿搭不重样」榨干衣橱潜力']);

  openModal(
    modalHead('📊 衣橱自动分析报告') +
    '<div class="m-body">' +
      '<div class="text-3" style="margin-bottom:6px">共 <b style="color:var(--primary-deep)">' + items.length + '</b> 件单品 · 统计截至 ' + new Date().toLocaleDateString('zh-CN') + '</div>' +
      '<table class="md-table">' + tableRows + '</table>' +
      '<div class="card-title mt12">🎨 颜色 TOP</div>' +
      '<table class="md-table">' + topColors.map((c) => '<tr><th>' + c[0] + '</th><td>' + c[1] + ' 件</td></tr>').join('') + '</table>' +
      '<div class="card-title mt12">💡 精简 & 补货建议</div>' +
      advice.map((a) => '<div class="advice-item"><div class="a-emoji">' + a[0] + '</div><div class="a-text">' + a[1] + '</div></div>').join('') +
    '</div>'
  );
}

/* ==================================================================
   v1.3 功能4：批量导入衣物（追加模式，永不覆盖现有数据）
   ① 批量图片上传：多选 → 逐张抠图/识别 → 进度条 → 汇总结果
   ② 批量 JSON 追加导入：数组 → 同 ID 自动跳过 → 逐条统计
   ================================================================== */
function showBulkProgress(label) {
  const box = $('#bulk-progress');
  if (!box) return null;
  box.classList.remove('hidden');
  box.innerHTML =
    '<div class="bulk-box"><div class="b-txt"><span id="bulk-label">' + esc(label) + '</span>' +
    '<span id="bulk-count"></span></div>' +
    '<div class="b-bar"><i id="bulk-bar"></i></div></div>';
  return {
    set(done, total, extra) {
      const bar = $('#bulk-bar'), cnt = $('#bulk-count'), lb = $('#bulk-label');
      if (bar) bar.style.width = (total ? Math.round(done / total * 100) : 0) + '%';
      if (cnt) cnt.textContent = done + ' / ' + total + (extra ? ' · ' + extra : '');
      if (lb && extra) lb.textContent = label;
    },
    finish() { const box2 = $('#bulk-progress'); if (box2) box2.classList.add('hidden'); },
  };
}

/* 批量图片：追加写入衣橱（沿用上传锁，避免与普通上传并发冲突） */
async function bulkImportImages(files) {
  const imgs = Array.from(files).filter((f) => f.type.startsWith('image/'));
  if (!imgs.length) { toast('⚠️ 未选择有效图片', 'warn'); return; }
  if (S.isUploading) { toast('⏳ 正在处理其他图片，请稍候…', 'warn'); return; }
  S.isUploading = true;
  updateUploadButton();
  const prog = showBulkProgress('🖼 正在批量导入图片…');
  let ok = 0; const failed = [];
  try {
    for (let i = 0; i < imgs.length; i++) {
      if (prog) prog.set(i, imgs.length, '成功 ' + ok + ' · 失败 ' + failed.length);
      try {
        const card = await withTaskTimeout(processOneImage(imgs[i]), '第 ' + (i + 1) + ' 张', TASK_TIMEOUT);
        const item = {
          id: uid(), name: card.name, cat: card.cat,
          colors: card.colors, mainColor: card.colors[0].name,
          fabric: card.fabric ? String(card.fabric).split(/[、,，]/).filter(Boolean) : [],
          style: card.style ? String(card.style).split(/[、,，]/).filter(Boolean) : [],
          season: card.season ? String(card.season).split(/[、,，]/).filter(Boolean) : [],
          scenes: [], fit: card.fit || '', status: 'active',
          wearCount: 0,                       /* v1.3 新增字段（只追加） */
          full: card.img, thumb: card.thumb, w: card.w, h: card.h, simple: card.simple,
          createdAt: Date.now(), updatedAt: Date.now(),
        };
        await dbAdd('items', item);
        S.items.push(item);
        ok++;
      } catch (e) {
        failed.push((i + 1) + '. ' + (e && e.message ? e.message : '未知错误'));
      }
      if (prog) prog.set(i + 1, imgs.length, '成功 ' + ok + ' · 失败 ' + failed.length);
    }
  } finally {
    S.isUploading = false;
    updateUploadButton();
    renderCloset(); renderCalendar();
  }
  if (prog) prog.finish();
  /* 汇总提示：成功 XX 件，失败 XX 件 */
  toast('📥 批量导入完成：成功 <b>' + ok + '</b> 件，失败 <b>' + failed.length + '</b> 件' +
    (failed.length ? '<br><span style="font-size:11px">' + failed.slice(0, 2).join('；') + (failed.length > 2 ? ' 等' : '') + '</span>' : ''),
    ok ? 'ok' : 'warn', 5200);
}

/* 批量 JSON：追加导入，同 ID 自动跳过（绝不覆盖现有衣橱数据） */
async function bulkImportJson(file) {
  let arr;
  try {
    const data = JSON.parse(await file.text());
    /* 兼容三种形态：纯数组 / {items:[…]} / 完整备份对象 */
    arr = Array.isArray(data) ? data : (data && Array.isArray(data.items) ? data.items : null);
    if (!arr) throw new Error('未找到衣物数组');
  } catch (e) {
    toast('⚠️ JSON 解析失败：' + (e && e.message ? e.message : '格式不对'), 'warn', 4200);
    return;
  }
  if (!arr.length) { toast('⚠️ JSON 中没有衣物数据', 'warn'); return; }
  const exist = new Set(S.items.map((i) => i.id));
  const prog = showBulkProgress('🗂 正在追加导入衣物…');
  let added = 0, skipped = 0, fixed = 0;
  for (let i = 0; i < arr.length; i++) {
    const raw = arr[i];
    if (!raw || typeof raw !== 'object') { skipped++; prog.set(i + 1, arr.length); continue; }
    /* 没有 id 的补一个；已有 id 且在库中的直接跳过，避免重复新增旧单品 */
    let id = raw.id;
    if (!id) { id = uid(); fixed++; }
    if (exist.has(id)) { skipped++; prog.set(i + 1, arr.length); continue; }
    const item = Object.assign({}, raw, { id });
    /* 只补齐缺失的 v1.3 字段，不改写原有字段结构 */
    if (typeof item.wearCount !== 'number') item.wearCount = 0;
    if (!item.status) item.status = 'active';
    if (!item.createdAt) item.createdAt = Date.now();
    item.updatedAt = item.updatedAt || item.createdAt;
    try {
      await dbPut('items', item);
      S.items.push(item);
      exist.add(id);
      added++;
    } catch (e) { skipped++; }
    prog.set(i + 1, arr.length, '新增 ' + added + ' · 跳过 ' + skipped);
  }
  if (prog) prog.finish();
  renderCloset(); renderCalendar();
  toast('🗂 JSON 追加导入完成：新增 <b>' + added + '</b> 件，跳过重复 <b>' + skipped + '</b> 件' +
    (fixed ? '<br><span style="font-size:11px">其中 ' + fixed + ' 条缺少 ID，已自动补全</span>' : '') +
    '<br><span style="font-size:11px">现有衣橱数据未受影响 ✅</span>', added ? 'ok' : 'warn', 5600);
}
